name: Portal Canary
description: Differential runtime-upgrade testing for Portaldot. Fails the job on any REGRESSION.
branding:
  icon: shield
  color: green
inputs:
  baseline:
    description: Baseline Substrate WebSocket endpoint
    required: true
  candidate:
    description: Candidate Substrate WebSocket endpoint
    required: true
  suite:
    description: Workflow file or directory (defaults to the bundled corpus)
    required: false
    default: ""
  injected:
    description: Label the candidate as a deliberately injected regression
    required: false
    default: ""
outputs:
  report:
    description: Path to the run directory containing report.json and report.html
    value: ${{ steps.run.outputs.report }}
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.1.38
    - shell: bash
      run: |
        cd "${{ github.action_path }}/backend"
        cargo build --release -q
        (cd driver && bun install --silent)
    - id: run
      shell: bash
      run: |
        A="${{ github.action_path }}/backend"
        SUITE="${{ inputs.suite }}"; [ -n "$SUITE" ] || SUITE="$A/tests/workflows"
        ARGS=(--baseline "${{ inputs.baseline }}" --candidate "${{ inputs.candidate }}" --suite "$SUITE" --out runs/canary --driver "$A/driver/src/run.ts")
        [ -n "${{ inputs.injected }}" ] && ARGS+=(--injected "${{ inputs.injected }}")
        set +e
        "$A/target/release/canary" test "${ARGS[@]}"
        code=$?
        echo "report=$(ls -d runs/canary/* | sort | tail -n 1)" >> "$GITHUB_OUTPUT"
        exit $code
