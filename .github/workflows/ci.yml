name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo build --release

  integration:
    # Real Portaldot dev node: doctor, live-mainnet compare, and a determinism
    # control (baseline == candidate) that must come back all PASS.
    runs-on: ubuntu-22.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - run: cargo build --release
      - run: cd driver && bun install
      - name: start portaldot dev node
        run: |
          curl -fsSL -o node.tgz https://github.com/portaldotVolunteer/Portaldot-node/raw/main/portaldot-testnet-ubuntu.tar.gz
          tar -xzf node.tgz
          ./portaldot-testnet-ubuntu/portaldot_dev --dev --tmp > node.log 2>&1 &
          for i in $(seq 60); do ./target/release/canary doctor >/dev/null 2>&1 && break; sleep 1; done
          sleep 8
      - run: ./target/release/canary doctor --ws ws://127.0.0.1:9944
      - run: ./target/release/canary compare --baseline wss://mainnet.portaldot.io --candidate ws://127.0.0.1:9944
        continue-on-error: true # mainnet reachability is outside our control
      - name: determinism control
        run: ./target/release/canary test --baseline ws://127.0.0.1:9944 --candidate ws://127.0.0.1:9944 --out runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-report
          path: |
            runs/ci
            node.log
