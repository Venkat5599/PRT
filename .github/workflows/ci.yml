name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # The Rust workspace in backend/: unit tests and the release CLI.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test --all
      - run: cargo build --release

  frontend:
    # The site in frontend/: the wasm compare engine must build from the same Rust
    # code, and the Next.js app must typecheck and prerender.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cd backend && cargo test -p canary-wasm
      - run: scripts/build-wasm.sh
      - name: install
        run: cd frontend && bun install --frozen-lockfile
      - name: typecheck
        run: cd frontend && bun run typecheck
      - name: tests (landing markup, report hashes and verdicts, CLI parity, packaged suite)
        run: cd frontend && bun test tests
      - name: build
        run: cd frontend && bun run build

  dashboard-e2e:
    # The production build in Chromium (desktop and phone): every view, Compare against the real
    # mainnet and V3 nodes, refused input, the supply invariant, runs and their on-chain record.
    runs-on: ubuntu-22.04
    needs: frontend
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cd frontend && bun install --frozen-lockfile
      - run: cd frontend && bun run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: browser tests
        env:
          CANARY_GH_TOKEN: ${{ github.token }}
        run: cd frontend && npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  integration:
    # Real Portaldot dev node: doctor, live-mainnet compare, and a determinism
    # control (baseline == candidate) that must come back all PASS.
    runs-on: ubuntu-22.04
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cargo build --release
      - run: cd driver && bun install
      - name: start portaldot dev node
        run: |
          curl -fsSL -o node.tgz https://github.com/portaldotVolunteer/Portaldot-node/raw/main/portaldot-testnet-ubuntu.tar.gz
          tar -xzf node.tgz
          ./portaldot-testnet-ubuntu/portaldot_dev --dev --tmp > node.log 2>&1 &
          for i in $(seq 60); do ./target/release/canary doctor >/dev/null 2>&1 && break; sleep 1; done
          sleep 8
      - run: ./target/release/canary doctor --ws ws://127.0.0.1:9944
      - run: ./target/release/canary compare --baseline wss://mainnet.portaldot.io --candidate ws://127.0.0.1:9944
        continue-on-error: true # mainnet reachability is outside our control
      - name: determinism control
        run: ./target/release/canary test --baseline ws://127.0.0.1:9944 --candidate ws://127.0.0.1:9944 --out runs/ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canary-report
          path: |
            backend/runs/ci
            backend/node.log
