[package]
name = "canary-chain"
description = "Minimal, metadata-version-agnostic Substrate client used by Portal Canary"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
url.workspace = true
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "native-tls"] }
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
blake2 = "0.10"
sha2 = "0.10"
